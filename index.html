<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08191F">
<title>Gold Spot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:      #08191F;
    --ink-2:    #0F2C36;
    --rule:     #1E4655;
    --mist:     #7E9AA6;
    --gold:     #D8A93A;
    --gold-lit: #FBEFC0;
    --gold-deep:#7A5410;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{min-height:100%}
  body{
    min-height:100vh;
    background:
      radial-gradient(120% 80% at 50% -10%, var(--ink-2) 0%, var(--ink) 60%);
    background-attachment:fixed;
    color:var(--mist);
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    -webkit-font-smoothing:antialiased;
    display:flex;justify-content:center;
    padding:clamp(20px,5vw,48px) clamp(16px,5vw,24px)
            calc(48px + env(safe-area-inset-bottom));
  }
  .wrap{width:100%;max-width:520px}


  /* ---- hero: the spot price ---- */
  .hero{padding:clamp(8px,3vw,20px) 0 clamp(26px,7vw,40px);text-align:center}
  .price{
    font-family:"Playfair Display",Georgia,serif;
    font-weight:700;
    font-size:clamp(44px,12.5vw,78px);
    line-height:1.16;
    padding-bottom:.18em;
    letter-spacing:-.015em;
    font-variant-numeric:tabular-nums;
    background:linear-gradient(100deg,
      var(--gold-deep) 0%, var(--gold) 24%, var(--gold-lit) 42%,
      var(--gold) 58%, var(--gold-deep) 82%, var(--gold) 100%);
    background-size:280% 100%;
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
    animation:sheen 9s linear infinite;
  }
  @keyframes sheen{from{background-position:180% 0}to{background-position:-100% 0}}
  .price .cur{font-size:.66em;margin-right:.08em}
  .price .comma{font-size:1.12em;margin:0 .01em}
  .price.loading{animation:none;opacity:.45}
  .hero .unit{
    margin-top:18px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;
  }
  .hero .unit b{color:#B9CFD9;font-weight:500}

  /* ---- per-gram table ---- */
  .eyebrow{
    display:flex;align-items:center;gap:12px;
    font-size:10px;letter-spacing:.24em;text-transform:uppercase;margin-bottom:12px;
  }
  .eyebrow::after{content:"";flex:1;height:1px;background:var(--rule)}
  table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
  thead th{
    font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;
    color:var(--mist);text-align:right;padding:0 0 9px;white-space:nowrap;
  }
  thead th:first-child{text-align:left}
  tbody td{
    padding:12px 0;border-top:1px solid var(--rule);text-align:right;color:#DCE8ED;
  }
  tbody td:first-child{
    text-align:left;color:var(--gold);font-weight:600;letter-spacing:.08em;
  }
  tbody td.markup{color:var(--mist)}
  tbody tr:last-child td{border-bottom:1px solid var(--rule)}
  tbody tr:last-child td:first-child{color:var(--gold-lit)}

  /* ---- calculator ---- */
  .calc{display:flex;flex-direction:column;gap:14px}
  .calc-top{display:flex;gap:12px}
  .calc-top .field{flex:1}
  .field{display:flex;flex-direction:column;gap:6px}
  .flabel{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mist)}
  select,.calc input{
    font:inherit;font-size:15px;color:#DCE8ED;background:#08161C;
    border:1px solid var(--rule);border-radius:2px;padding:10px 11px;width:100%;
  }
  select{
    appearance:none;-webkit-appearance:none;cursor:pointer;color:var(--gold);font-weight:600;
    background-image:linear-gradient(45deg,transparent 50%,var(--mist) 50%),
                     linear-gradient(135deg,var(--mist) 50%,transparent 50%);
    background-position:calc(100% - 16px) 19px, calc(100% - 11px) 19px;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat;
  }
  select:focus-visible,.calc input:focus-visible{outline:2px solid var(--gold);outline-offset:1px}

  .seg{display:flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden}
  .seg button{
    flex:1;border:0;border-radius:0;padding:11px 6px;
    font-size:10px;letter-spacing:.1em;color:var(--mist);background:transparent;
  }
  .seg button + button{border-left:1px solid var(--rule)}
  .seg button.on{background:rgba(216,169,58,.12);color:var(--gold-lit)}

  .inwrap{display:flex;align-items:center;background:#08161C;border:1px solid var(--rule);border-radius:2px}
  .inwrap:focus-within{outline:2px solid var(--gold);outline-offset:1px}
  .inwrap input{border:0;background:transparent;font-variant-numeric:tabular-nums}
  .inwrap input:focus-visible{outline:none}
  .affix{color:var(--mist);font-size:14px;padding:0 11px;flex:none}
  .affix:empty{display:none}
  /* strip the spinner so the field reads as a number, not a stepper */
  .calc input::-webkit-outer-spin-button,.calc input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .calc input[type=number]{-moz-appearance:textfield}

  .result{
    display:flex;flex-direction:column;gap:3px;
    border-top:1px solid var(--rule);padding-top:14px;
  }
  .rlabel{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mist)}
  .range{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .rend{display:flex;flex-direction:column;gap:2px}
  .rval{
    font-size:clamp(19px,5.6vw,26px);font-weight:600;color:var(--gold-lit);
    font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap;
  }
  .rcap{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--mist)}
  .rdash{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#5C7681}
  .rwork{font-size:10.5px;color:#5C7681;letter-spacing:.04em;min-height:14px}

  /* ---- footer ---- */
  .foot{margin-top:20px;display:flex;align-items:center;gap:8px}
  button{
    font:inherit;font-size:10px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--gold);background:transparent;border:1px solid var(--rule);
    padding:9px 15px;border-radius:2px;cursor:pointer;white-space:nowrap;
    transition:border-color .2s,color .2s;
  }
  button:hover{border-color:var(--gold);color:var(--gold-lit)}
  button:focus-visible{outline:2px solid var(--gold-lit);outline-offset:2px}
  .note{
    margin-top:14px;font-size:10.5px;letter-spacing:.06em;
    color:#5C7681;text-align:right;line-height:1.6;
  }
  .note.warn{color:#B08A3C}

  /* ---- manual fallback ---- */
  .manual{
    margin-top:16px;padding:14px;border:1px solid var(--rule);border-radius:2px;
    display:none;
  }
  .manual.show{display:block}
  .manual p{font-size:11px;line-height:1.6;color:#B9CFD9;margin-bottom:10px}
  .why{margin-bottom:12px}
  .why span{
    display:block;font-size:10px;line-height:1.5;color:#5C7681;
    padding-left:10px;border-left:1px solid var(--rule);margin-bottom:5px;
  }
  .manual .row{display:flex;gap:8px}
  .manual input{
    flex:1;min-width:0;font:inherit;font-size:14px;color:var(--gold-lit);background:#08161C;
    border:1px solid var(--rule);border-radius:2px;padding:9px 10px;
  }
  .manual input:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
  .manual a{color:var(--gold)}

  /* ---- history chart ---- */
  .hist-head{
    display:flex;justify-content:space-between;align-items:flex-end;
    gap:12px;margin-bottom:14px;
  }
  .hchg{
    font-size:15px;font-weight:600;color:#DCE8ED;
    font-variant-numeric:tabular-nums;white-space:nowrap;min-height:20px;
  }
  .hchg .arw{font-size:.8em;margin-right:4px}
  .hchg.up .arw{color:#8CCBA3}
  .hchg.down .arw{color:#E0937F}
  .hsub{
    font-size:10px;letter-spacing:.06em;color:#5C7681;margin-top:4px;
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .seg.rng{flex:none}
  .seg.rng button{padding:8px 0;width:40px;flex:none}
  .chart{position:relative;height:clamp(220px,58vw,270px);touch-action:pan-y;user-select:none;-webkit-user-select:none}
  .chart svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .chart .grid{stroke:var(--rule);stroke-width:1}
  .chart .ylab,.chart .xlab{fill:#5C7681;font-size:9.5px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
  .chart .line{fill:none;stroke:var(--gold);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
  .chart .cross{stroke:var(--mist);stroke-width:1;stroke-dasharray:2 3}
  .chart .dot{fill:var(--gold-lit);stroke:var(--ink);stroke-width:2}
  .chart .msg{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:10.5px;letter-spacing:.08em;color:#5C7681;text-align:center;padding:0 20px;
  }
  .chart .msg:empty{display:none}
  .tip{
    position:absolute;top:0;pointer-events:none;
    background:#08161C;border:1px solid var(--rule);border-radius:2px;
    padding:6px 9px;font-size:10px;letter-spacing:.04em;color:var(--mist);
    white-space:nowrap;transform:translateX(-50%);opacity:0;transition:opacity .12s;
  }
  .tip.on{opacity:1}
  .tip b{display:block;color:var(--gold-lit);font-size:13px;font-weight:600;letter-spacing:0;margin-top:1px}

  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important}
    .price{background-position:40% 0}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <div class="price loading" id="price"><span class="cur">$</span>——</div>
    <div class="unit">per troy ounce · <b>24k fine</b></div>
  </div>

  <div class="eyebrow">Per gram</div>
  <table>
    <thead>
      <tr><th>Karat</th><th>Spot</th><th>Spot + 50%</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <div class="eyebrow" style="margin-top:30px">Calculate</div>
  <div class="calc">
    <div class="calc-top">
      <label class="field">
        <span class="flabel">Karat</span>
        <select id="cKarat"></select>
      </label>
      <div class="field">
        <span class="flabel">I know the</span>
        <div class="seg" id="cMode" role="group" aria-label="Input type">
          <button type="button" data-mode="g" class="on" aria-pressed="true">Weight</button>
          <button type="button" data-mode="d" aria-pressed="false">Total $</button>
        </div>
      </div>
    </div>
    <label class="field">
      <span class="flabel" id="cLabel">Weight in grams</span>
      <div class="inwrap">
        <span class="affix" id="cPre"></span>
        <input id="cInput" type="number" inputmode="decimal" step="any" min="0" placeholder="0">
        <span class="affix" id="cSuf">g</span>
      </div>
    </label>
    <div class="result" id="cResult">
      <span class="rlabel" id="cRLabel">Value</span>
      <div class="range">
        <span class="rend"><span class="rval" id="cLo">—</span><span class="rcap" id="cLoCap">at spot</span></span>
        <span class="rdash">to</span>
        <span class="rend"><span class="rval" id="cHi">—</span><span class="rcap" id="cHiCap">at +50%</span></span>
      </div>
      <span class="rwork" id="cRWork"></span>
    </div>
  </div>

  <div class="foot">
    <button id="refresh" type="button">Refresh</button>
    <button id="setBtn" type="button">Set by hand</button>
  </div>
  <p class="note" id="note">1 troy oz = 31.1035 g</p>

  <div class="manual" id="manual">
    <p>Enter a spot price per troy ounce to use instead of the feed.</p>
    <div class="why" id="why"></div>
    <div class="row">
      <input id="manualInput" type="number" inputmode="decimal" step="0.01" placeholder="3250.00" aria-label="Spot price per troy ounce">
      <button id="manualGo" type="button">Use</button>
    </div>
  </div>

  <!-- ---- history ---- -->
  <div class="eyebrow" style="margin-top:34px">History · per troy oz</div>
  <div class="hist-head">
    <div>
      <div class="hchg" id="hChg">&nbsp;</div>
      <div class="hsub" id="hSub">&nbsp;</div>
    </div>
    <div class="seg rng" id="hRange" role="group" aria-label="Chart range">
      <button type="button" data-r="1M" aria-pressed="false">1M</button>
      <button type="button" data-r="3M" aria-pressed="false">3M</button>
      <button type="button" data-r="6M" aria-pressed="false">6M</button>
      <button type="button" data-r="1Y" class="on" aria-pressed="true">1Y</button>
    </div>
  </div>
  <div class="chart" id="chart">
    <svg id="hSvg" role="img" aria-label="Gold price history"></svg>
    <div class="tip" id="hTip"></div>
    <div class="msg" id="hMsg">Loading history…</div>
  </div>
  <p class="note" id="hNote"></p>

</div>

<script>
'use strict';

const TROY_OZ_G = 31.1034768;
const KARATS    = [9, 10, 14, 18, 24];
const MARKUP    = 1.5;
const SANE_MIN  = 200, SANE_MAX = 100000;  // reject a feed returning nonsense
const STALE_MIN = 30;                      // quote older than this = stale
const CACHE_MS  = 30000;                   // gold-api asks callers to cache 30s
const TIMEOUT_MS = 8000;
const FEED_URL  = 'https://api.gold-api.com/price/XAU';
const FEED_NAME = 'gold-api.com';
const BASE_NOTE = '1 troy oz = 31.1035 g';

const $     = id => document.getElementById(id);
const money = n => n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
const grams = n => n.toLocaleString('en-US', {minimumFractionDigits:1, maximumFractionDigits:1});
const clock = d => d.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'});
const esc   = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let timer     = null;
let spotPerOz = null;    // latest $/troy oz, shared with the calculator
let manual    = false;   // a hand-entered price holds until Refresh is pressed
let inFlight  = null;    // dedupes overlapping loads
let cache     = null;    // {price, quotedAt, ttl, at}

/* ---- feed ---- */
async function fetchSpot(){
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), TIMEOUT_MS);
  try {
    const r = await fetch(FEED_URL, {signal: ctl.signal});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const body = await r.json();

    const price = Number(body.price);
    if (!isFinite(price) || price < SANE_MIN || price > SANE_MAX) throw new Error('price out of range');

    // An unparseable timestamp must not reach the UI as "Invalid Date".
    let quotedAt = body.updatedAt ? new Date(body.updatedAt) : null;
    if (!quotedAt || isNaN(quotedAt.getTime())) quotedAt = null;

    // Honour the feed's own cache window, never dipping below their 30s floor.
    const secs = parseInt((r.headers.get('cache-control') || '').match(/max-age=(\d+)/)?.[1], 10);
    const ttl  = Math.max(CACHE_MS, isFinite(secs) ? secs * 1000 : 0);
    return {price, quotedAt, ttl};
  } finally { clearTimeout(t); }
}

function describe(e){
  if (e.name === 'AbortError') return 'timed out';
  if (e instanceof TypeError)  return 'blocked or unreachable (CORS / sandbox / offline)';
  return e.message;
}

/* ---- rendering ---- */
function paint(spot){
  spotPerOz = spot;
  $('price').classList.remove('loading');
  $('price').innerHTML = '<span class="cur">$</span>' +
    money(spot).replace(/,/g, '<span class="comma">,</span>');
  const perGram24 = spot / TROY_OZ_G;
  $('rows').innerHTML = KARATS.map(k => {
    const g = perGram24 * (k / 24);
    return `<tr><td>${k}k</td><td>$${money(g)}</td><td class="markup">$${money(g * MARKUP)}</td></tr>`;
  }).join('');
  calc();
  drawHist();   // the live quote is the chart's last point
}

function note(text, warn){
  $('note').classList.toggle('warn', !!warn);
  $('note').innerHTML = BASE_NOTE + '<br>' + text;
}

function show(c){
  const stale = c.quotedAt ? (Date.now() - c.quotedAt.getTime()) / 60000 > STALE_MIN : false;
  const when  = c.quotedAt
    ? (stale ? 'Stale · quoted ' : 'Quoted ') + clock(c.quotedAt)
    : 'Fetched ' + clock(new Date(c.at));   // feed gave no usable timestamp
  paint(c.price);
  note(when + ' · ' + FEED_NAME, stale);
}

function schedule(ms){
  clearTimeout(timer);
  timer = setTimeout(load, Math.max(CACHE_MS, ms));
}

/* ---- load cycle ---- */
async function load(){
  if (manual) return;              // hand-entered price wins until Refresh
  if (inFlight) return inFlight;   // never run two fetches at once

  // Inside the feed's cache window there is nothing newer to get: reuse it.
  if (cache && Date.now() - cache.at < cache.ttl){
    show(cache);
    schedule(cache.at + cache.ttl - Date.now());
    return;
  }

  clearTimeout(timer);
  note('Fetching live price…', false);

  inFlight = (async () => {
    try {
      const r = await fetchSpot();
      cache = {price: r.price, quotedAt: r.quotedAt, ttl: r.ttl, at: Date.now()};
      $('manual').classList.remove('show');
      show(cache);
      schedule(r.ttl);
    } catch (e){
      offline(FEED_NAME + ' — ' + describe(e));
    } finally {
      inFlight = null;
    }
  })();
  return inFlight;
}

function offline(reason){
  const havePrice = !$('price').classList.contains('loading');
  note(havePrice ? 'Feed down · showing last known' : 'No feed', true);
  $('why').innerHTML = '<span>' + esc(reason) + '</span>';
  $('manual').classList.add('show');
  schedule(60000);   // keep retrying quietly
}

/* ---- calculator ---- */
const KNAMES = {9:'9k', 10:'10k', 14:'14k', 18:'18k', 24:'24k (fine)'};
let mode = 'g';   // 'g' = weight known, 'd' = dollars known

$('cKarat').innerHTML = KARATS.map(k =>
  `<option value="${k}"${k === 14 ? ' selected' : ''}>${KNAMES[k]}</option>`).join('');

const perGram = k => spotPerOz === null ? null : (spotPerOz / TROY_OZ_G) * (k / 24);

function calc(){
  const k  = Number($('cKarat').value);
  const v  = parseFloat($('cInput').value);
  const pg = perGram(k);

  $('cLabel').textContent  = mode === 'g' ? 'Weight in grams' : 'Total price of the piece';
  $('cPre').textContent    = mode === 'g' ? ''  : '$';
  $('cSuf').textContent    = mode === 'g' ? 'g' : '';
  $('cRLabel').textContent = mode === 'g' ? 'Value' : 'Weight with that value';

  const blank = msg => {
    $('cLo').textContent = $('cHi').textContent = '—';
    $('cRWork').textContent = msg;
  };
  if (pg === null) return blank('Waiting on a spot price');
  if (!isFinite(v) || v <= 0) return blank('');

  const pgHi = pg * MARKUP;   // per-gram at spot + 50%

  if (mode === 'g'){
    // More dollars per gram means a higher value: spot is the low end.
    $('cLo').textContent = '$' + money(v * pg);
    $('cHi').textContent = '$' + money(v * pgHi);
    $('cLoCap').textContent = 'at spot';
    $('cHiCap').textContent = 'at +50%';
    $('cRWork').textContent = grams(v) + ' g × $' + money(pg) + '–$' + money(pgHi) + '/g at ' + KNAMES[k];
  } else {
    // More dollars per gram means the same money buys LESS gold: +50% is the low end.
    $('cLo').textContent = grams(v / pgHi) + ' g';
    $('cHi').textContent = grams(v / pg) + ' g';
    $('cLoCap').textContent = 'at +50%';
    $('cHiCap').textContent = 'at spot';
    $('cRWork').textContent = '$' + money(v) + ' ÷ $' + money(pg) + '–$' + money(pgHi) + '/g at ' + KNAMES[k];
  }
}

$('cMode').addEventListener('click', e => {
  const btn = e.target.closest('button[data-mode]');
  if (!btn) return;
  mode = btn.dataset.mode;
  [...$('cMode').children].forEach(b => {
    const on = b === btn;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on);
  });
  $('cInput').value = '';
  calc(); $('cInput').focus();
});
$('cKarat').addEventListener('change', calc);
$('cInput').addEventListener('input', calc);

/* ---- history: data ---- */
// gold-api.com only. The /history endpoint needs a key (free tier: 10 requests/hour);
// fetching at most once a day keeps well inside that.
const GOLD_API_KEY = 'bf134fac818f90971820d2d47ad58f935cfa2f660093c14998b6b550ebd9c186';

const HIST_URL   = 'https://api.gold-api.com/history';
const HIST_LS    = 'goldSpot.history.v2';
const RETRY_MS   = 15 * 60e3;      // after a failure, don't auto-retry for 15 min
const HIST_KEEP  = 400;            // days kept (a year plus margin)
const DAY        = 864e5;
const RANGES     = {'1M':30, '3M':91, '6M':182, '1Y':365};

let hist     = null;     // [{t, p}] ascending, t = UTC midnight of the day
let histAt   = 0;        // when the shown history was fetched
let histBusy = null;
let lastFail = 0;
let histErr  = '';       // why the last fetch failed, shown under the chart
let range    = '1Y';

// Storage can throw (private mode, blocked site data); history still works without it.
const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch {} },
};

function utcDay(s){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s));
  return m ? Date.UTC(+m[1], m[2] - 1, +m[3]) : NaN;
}
// Today's calendar date where the viewer is, stored on the same UTC-midnight grid as the data.
const todayUTC = () => { const d = new Date(); return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()); };
const sameLocalDay = (a, b) => new Date(a).toDateString() === new Date(b).toDateString();

// One price per day, sane values only, last HIST_KEEP days, ascending.
function clean(rows){
  const cutoff = todayUTC() - HIST_KEEP * DAY, byDay = new Map();
  for (const r of rows)
    if (isFinite(r.t) && r.t >= cutoff && isFinite(r.p) && r.p > SANE_MIN && r.p < SANE_MAX) byDay.set(r.t, r.p);
  return [...byDay].map(([t, p]) => ({t, p})).sort((a, b) => a.t - b.t);
}

async function fetchHistory(key){
  const end = Math.floor(Date.now() / 1000), start = end - HIST_KEEP * 86400;
  const q = new URLSearchParams({symbol:'XAU', startTimestamp:start, endTimestamp:end,
                                 groupBy:'day', aggregation:'avg', orderBy:'asc'});
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 20000);
  try {
    const r = await fetch(HIST_URL + '?' + q, {headers: {'x-api-key': key}, signal: ctl.signal});
    if (r.status === 401 || r.status === 403) throw new Error('key rejected (HTTP ' + r.status + ')');
    if (r.status === 429) throw new Error('rate limited — try again within the hour');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const body = await r.json();
    const arr  = Array.isArray(body) ? body : (body.data || []);
    const rows = clean(arr.map(x => ({
      t: utcDay(x.day ?? x.date),
      p: Number(x.avg_price ?? x.price ?? x.max_price),
    })));
    if (rows.length < 20) throw new Error('history came back empty');
    return rows;
  } finally { clearTimeout(t); }
}

function readCache(){
  try {
    const c = JSON.parse(store.get(HIST_LS));
    return c && Array.isArray(c.rows) && c.rows.length ? c : null;
  } catch { return null; }
}

// Fetches at most once per calendar day.
async function loadHistory(){
  if (histBusy) return histBusy;
  const c = readCache();
  if (c && !hist){ hist = c.rows; histAt = c.at; drawHist(); }
  if (c && sameLocalDay(c.at, Date.now())) return;
  if (Date.now() - lastFail < RETRY_MS) return;
  if (!hist) histMsg('Loading history…');

  histBusy = (async () => {
    try {
      hist = await fetchHistory(GOLD_API_KEY); histAt = Date.now(); lastFail = 0; histErr = '';
      store.set(HIST_LS, JSON.stringify({at: histAt, rows: hist}));
      drawHist();
    } catch (e){
      lastFail = Date.now();
      histErr  = 'Couldn\u2019t update: ' + describe(e);
      if (hist) drawHist(); else { histMsg('History unavailable'); histNote(); }
    }
  })().finally(() => { histBusy = null; });
  return histBusy;
}

/* ---- history: drawing ---- */
const NS     = 'http://www.w3.org/2000/svg';
const usd0   = n => '$' + n.toLocaleString('en-US', {maximumFractionDigits:0});
const dfmt   = (t, o) => new Date(t).toLocaleDateString('en-US', {timeZone:'UTC', ...o});
let plotted  = null;   // {pts, x, y, W, H} for the hover layer

function histMsg(text){
  $('hSvg').innerHTML = '';
  $('hMsg').textContent = text;
  $('hChg').innerHTML = $('hSub').innerHTML = '&nbsp;';
  plotted = null;
}

function series(){
  const pts = hist.slice();
  // Append today's live quote so the line ends at the price shown above.
  if (cache && !manual){
    const today = todayUTC();
    const lastT = pts[pts.length - 1].t;
    if (lastT < today) pts.push({t: today, p: cache.price, live: true});
    else if (lastT === today) pts[pts.length - 1] = {t: today, p: cache.price, live: true};
  }
  const from = pts[pts.length - 1].t - RANGES[range] * DAY;
  return pts.filter(p => p.t >= from);
}

function niceStep(raw){
  const pow = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / pow;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * pow;
}

function xTicks(t0, t1){
  const out = [], d = new Date(t0);
  if (range === '1M'){
    // weekly, counted back from the last day
    for (let t = t1; t >= t0; t -= 7 * DAY) out.unshift({t, label: dfmt(t, {month:'short', day:'numeric'})});
    return out;
  }
  const every = range === '1Y' ? 2 : 1;   // months between labels
  let y = d.getUTCFullYear(), m = d.getUTCMonth() + 1;
  for (;;){
    if (m > 11){ m -= 12; y++; }
    const t = Date.UTC(y, m, 1);
    if (t > t1) break;
    out.push({t, label: m === 0 ? String(y) : dfmt(t, {month:'short'})});
    m += every;
  }
  return out;
}

function drawHist(){
  if (!hist) return;
  const pts = series();
  if (pts.length < 2) return histMsg('Not enough data for this range');
  $('hMsg').textContent = '';

  const box = $('chart'), W = box.clientWidth, H = box.clientHeight;
  const P = {t:48, r:54, b:24, l:2};   // top band holds the hover tooltip
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t;
  let lo = Infinity, hi = -Infinity;
  for (const p of pts){ if (p.p < lo) lo = p.p; if (p.p > hi) hi = p.p; }

  const step = niceStep(Math.max(hi - lo, hi * 0.01) / 3);
  const y0 = Math.floor(lo / step) * step, y1 = Math.ceil(hi / step) * step;
  const x = t => P.l + (t - t0) / (t1 - t0) * (W - P.l - P.r);
  const y = v => P.t + (1 - (v - y0) / (y1 - y0)) * (H - P.t - P.b);

  let s = `<defs><linearGradient id="hFill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#D8A93A" stop-opacity=".22"/>
    <stop offset="1" stop-color="#D8A93A" stop-opacity="0"/></linearGradient></defs>`;

  for (let v = y0; v <= y1 + step / 2; v += step){
    const yy = y(v).toFixed(1);
    s += `<line class="grid" x1="${P.l}" x2="${W - P.r}" y1="${yy}" y2="${yy}"/>`;
    s += `<text class="ylab" x="${W - P.r + 8}" y="${yy}" dy=".35em">${usd0(v)}</text>`;
  }
  for (const tk of xTicks(t0, t1)){
    const xx = x(tk.t);
    if (xx < P.l + 12 || xx > W - P.r - 12) continue;
    s += `<text class="xlab" x="${xx.toFixed(1)}" y="${H - 6}" text-anchor="middle">${tk.label}</text>`;
  }

  const line = pts.map((p, i) => (i ? 'L' : 'M') + x(p.t).toFixed(1) + ' ' + y(p.p).toFixed(1)).join('');
  s += `<path d="${line}L${x(t1).toFixed(1)} ${H - P.b}L${x(t0).toFixed(1)} ${H - P.b}Z" fill="url(#hFill)"/>`;
  s += `<path class="line" d="${line}"/>`;
  const last = pts[pts.length - 1];
  s += `<circle class="dot" cx="${x(last.t).toFixed(1)}" cy="${y(last.p).toFixed(1)}" r="4"/>`;
  s += `<g id="hHover" style="display:none"><line class="cross" y1="${P.t}" y2="${H - P.b}"/><circle class="dot" r="5"/></g>`;
  $('hSvg').innerHTML = s;

  plotted = {pts, x, y};

  // header: change across the visible range
  const first = pts[0].p, diff = last.p - first, pct = diff / first * 100;
  const up = diff >= 0;
  $('hChg').className = 'hchg ' + (up ? 'up' : 'down');
  $('hChg').innerHTML = `<span class="arw" aria-hidden="true">${up ? '▲' : '▼'}</span>` +
    `${up ? '+' : '−'}$${money(Math.abs(diff))} · ${up ? '+' : '−'}${Math.abs(pct).toFixed(1)}%`;
  $('hSub').textContent = 'Low ' + usd0(lo) + ' · High ' + usd0(hi);
  $('hSvg').setAttribute('aria-label',
    `Gold price over ${range}: from $${money(first)} to $${money(last.p)}, low ${usd0(lo)}, high ${usd0(hi)}`);
  histNote('Daily avg \u00b7 ' + dfmt(t0, {month:'short', day:'numeric', year:'numeric'}) +
    ' \u2013 today \u00b7 gold-api.com \u00b7 updated ' +
    new Date(histAt).toLocaleDateString('en-US', {month:'short', day:'numeric'}));
}

// Source line under the chart; a failed update is added on its own line, in the warning colour.
function histNote(text){
  $('hNote').classList.toggle('warn', !!histErr);
  $('hNote').innerHTML = [text, histErr].filter(Boolean).map(esc).join('<br>');
}

/* ---- history: hover / touch ---- */
function hover(e){
  if (!plotted) return;
  const {pts, x, y} = plotted;
  const rect = $('hSvg').getBoundingClientRect(), px = e.clientX - rect.left;
  // nearest point by x (binary search; points are ascending)
  let a = 0, b = pts.length - 1;
  while (b - a > 1){ const m = (a + b) >> 1; if (x(pts[m].t) < px) a = m; else b = m; }
  const p = Math.abs(x(pts[a].t) - px) <= Math.abs(x(pts[b].t) - px) ? pts[a] : pts[b];
  const cx = x(p.t), cy = y(p.p);

  const g = $('hHover');
  if (!g) return;
  g.style.display = '';
  g.children[0].setAttribute('x1', cx); g.children[0].setAttribute('x2', cx);
  g.children[1].setAttribute('cx', cx); g.children[1].setAttribute('cy', cy);

  const tip = $('hTip');
  tip.innerHTML = esc(dfmt(p.t, {weekday:'short', month:'short', day:'numeric', year:'numeric'})) +
    (p.live ? ' · live' : '') + '<b>$' + money(p.p) + '</b>';
  const half = tip.offsetWidth / 2;
  tip.style.left = Math.min(Math.max(cx, half), rect.width - half) + 'px';
  tip.classList.add('on');
}
function unhover(){
  const g = $('hHover'); if (g) g.style.display = 'none';
  $('hTip').classList.remove('on');
}
$('hSvg').addEventListener('pointermove', hover);
$('hSvg').addEventListener('pointerdown', hover);
$('hSvg').addEventListener('pointerleave', unhover);
$('hSvg').addEventListener('pointercancel', unhover);

$('hRange').addEventListener('click', e => {
  const btn = e.target.closest('button[data-r]');
  if (!btn) return;
  range = btn.dataset.r;
  [...$('hRange').children].forEach(b => {
    const on = b === btn;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on);
  });
  unhover();
  drawHist();
});

let rz = 0;
new ResizeObserver(() => { cancelAnimationFrame(rz); rz = requestAnimationFrame(drawHist); }).observe($('chart'));


/* ---- controls ---- */
$('refresh').addEventListener('click', () => {
  manual = false;               // the only thing that drops a hand-entered price
  $('manual').classList.remove('show');
  load();
  loadHistory();                // no-op if history was already fetched today
});
$('setBtn').addEventListener('click', () => {
  $('manual').classList.toggle('show');
  if ($('manual').classList.contains('show')) $('manualInput').focus();
});
$('manualGo').addEventListener('click', () => {
  const p = Number($('manualInput').value);
  if (!isFinite(p) || p <= 0) return;
  manual = true;
  clearTimeout(timer);          // stop polling; this price holds
  paint(p);
  note('Entered by hand · Refresh to go back to the feed', true);
});
$('manualInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('manualGo').click(); });

// Phones suspend background tabs; re-check on return (no-op while manual, cached inside 30s).
document.addEventListener('visibilitychange', () => { if (!document.hidden){ load(); loadHistory(); } });
window.addEventListener('online', () => { load(); loadHistory(); });

load();
loadHistory();
</script>
